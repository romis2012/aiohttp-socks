name: CI

on:
  push:
    branches: ["master"]
  pull_request:
    branches: ["master"]

jobs:
  build:
    name: "Python ${{ matrix.python-version }} ${{ matrix.os }}"
    runs-on: "${{ matrix.os }}"
    strategy:
      matrix:
        python-version: ["3.9", "3.10", "3.11", "3.12", "3.13", "3.14"]
        os: [ubuntu-latest]
    
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup uv
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          enable-cache: true
          python-version: ${{ matrix.python-version }}
      
      - name: Run Ruff Checks
        run: |
          uv run ruff check --output-format=github aiohttp_socks tests
          uv run ruff format --check aiohttp_socks tests

      - name: Run Mypy Type Checker
        run: |
          uv run mypy aiohttp_socks tests
      
      - name: Run tests
        run: |
          uv run pytest tests --cov=./aiohttp_socks --cov-report xml

      - name: Upload coverage
        uses: codecov/codecov-action@v5
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          slug: romis2012/aiohttp-socks
          file: ./coverage.xml
          flags: unit
          fail_ci_if_error: false